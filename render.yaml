services:
  - type: web
    name: arjun-dharshini-wedding
    env: static
    # The build command runs from the root of the monorepo, filtering to build ONLY the wedding website
    buildCommand: pnpm install && pnpm --filter "@workspace/arjun-dharshini-wedding" run build
    # The publish path is where Vite outputs the built files
    staticPublishPath: artifacts/arjun-dharshini-wedding/dist/public
    # Redirect all unmatched routes to index.html (useful for React apps)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
